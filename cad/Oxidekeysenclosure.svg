<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="230mm"
   height="160mm"
   viewBox="0 0 230 160"
   version="1.1"
   id="svg20"
   sodipodi:docname="Oxidekeysenclosure.svg"
   inkscape:version="1.4.4 (dcaf3e7, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs20" />
  <sodipodi:namedview
     id="namedview20"
     pagecolor="#505050"
     bordercolor="#ffffff"
     borderopacity="1"
     inkscape:showpageshadow="0"
     inkscape:pageopacity="0"
     inkscape:pagecheckerboard="1"
     inkscape:deskcolor="#505050"
     inkscape:document-units="mm"
     inkscape:zoom="0.81265075"
     inkscape:cx="398.07999"
     inkscape:cy="375.31498"
     inkscape:window-width="1450"
     inkscape:window-height="847"
     inkscape:window-x="10"
     inkscape:window-y="38"
     inkscape:window-maximized="0"
     inkscape:current-layer="top_panel" />
  <!-- Oxide Keys enclosure review geometry. Test fit and adjust kerf before cutting the final sheets. -->
  <!-- The PCB features are based on pcbfirstdesign.kicad_pcb and its STEP export. -->
  <!-- Cutout dimensions are nominal drawing paths; compensate for the actual laser kerf in the CAM software. -->
  <!-- Solid black = confirmed cut geometry. Dashed = assembly reference marks, not cut lines. -->
  <g
     id="base_plate"
     transform="translate(5,5)"
     fill="none"
     stroke="#000"
     stroke-width="0.1"
     style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1">
    <text
       x="0"
       y="-2"
       font-size="3"
       fill="#000"
       stroke="none"
       id="text1"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1">BASE PLATE</text>
    <rect
       x="0"
       y="0"
       width="97.75"
       height="91.5"
       id="rect1"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- Mounting holes MH1-4: 2.25 mm drawn diameter. Check fastener and kerf on a test piece. -->
    <circle
       cx="2.75"
       cy="2.75"
       r="1.125"
       id="circle1"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <circle
       cx="92.75"
       cy="3.0"
       r="1.125"
       id="circle2"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <circle
       cx="2.5"
       cy="89.0"
       r="1.125"
       id="circle3"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <circle
       cx="92.75"
       cy="88.75"
       r="1.125"
       id="circle4"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
  </g>
  <g
     id="top_panel"
     transform="translate(115,60)"
     fill="none"
     stroke="#000"
     stroke-width="0.1"
     style="fill:none;fill-opacity:1;stroke:#ffffff;stroke-opacity:1">
    <text
       x="0"
       y="-2"
       font-size="3"
       fill="#000"
       stroke="none"
       id="text4"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1">TOP PANEL (switch deck)</text>
    <rect
       x="0"
       y="0"
       width="97.75"
       height="91.5"
       id="rect4"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- Mounting holes, aligned with base plate -->
    <circle
       cx="2.75"
       cy="2.75"
       r="1.125"
       id="circle5"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <circle
       cx="92.75"
       cy="3.0"
       r="1.125"
       id="circle6"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <circle
       cx="2.5"
       cy="89.0"
       r="1.125"
       id="circle7"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <circle
       cx="92.75"
       cy="88.75"
       r="1.125"
       id="circle8"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- 8x 14.25 mm switch openings, centered on SW1-8 anchors. Test actual switch clips in 3 mm sheet. -->
    <!-- SW1 and SW3 connect to the rear header clearance. Their single
         merged outline avoids overlapping laser paths. -->
    <path id="header_switch_clearance"
       d="M 7.23,0.98 L 43.79,0.98 L 43.79,4.52 L 40.415,4.52 L 40.415,18.295 L 26.165,18.295 L 26.165,4.52 L 21.125,4.52 L 21.125,18.295 L 6.875,18.295 L 6.875,4.045 L 7.23,4.045 Z"
       style="fill:none;stroke:#000000;stroke-opacity:1" />
    <rect
       x="6.875"
       y="23.335"
       width="14.25"
       height="14.25"
       id="rect9"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- SW2 -->
    <!-- SW3 is included in header_switch_clearance above. -->
    <rect
       x="26.155"
       y="23.335"
       width="14.25"
       height="14.25"
       id="rect11"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- SW4 -->
    <rect
       x="45.455"
       y="4.045"
       width="14.25"
       height="14.25"
       id="rect12"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- SW5 -->
    <rect
       x="45.445"
       y="23.335"
       width="14.25"
       height="14.25"
       id="rect13"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- SW6 -->
    <rect
       x="64.745"
       y="4.045"
       width="14.25"
       height="14.25"
       id="rect14"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- SW7 -->
    <rect
       x="64.725"
       y="23.335"
       width="14.25"
       height="14.25"
       id="rect15"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- SW8 -->
    <!-- Encoder shaft hole: 7.15 mm drawn diameter. Confirm against the actual SR1230 bushing. -->
    <circle
       cx="91.25"
       cy="9.5"
       r="3.575"
       stroke="#c00"
       id="circle15"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- The buzzer clearance opening below also serves as the sound vent. -->
    <!-- USB opening, sized provisionally. Verify the actual plug and accessible insertion path. -->
    <rect
       x="71.425"
       y="82.425"
       width="10.15"
       height="6.15"
       stroke="#c00"
       id="rect16"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- Clear the modeled rear header, buzzer body and controller. The rear
         header clearance is close to the left hinge keep-clear zone; verify
         hinge mounting on a physical mockup before making the final cut file. -->
    <rect x="83.45" y="28.75" width="13" height="13" id="buzzer_clearance"
       style="fill:none;stroke:#000000;stroke-opacity:1" />
    <rect x="23.1" y="56.64" width="53.3" height="22" id="controller_clearance"
       style="fill:none;stroke:#000000;stroke-opacity:1" />
    <!-- 78 x 64 mm flap for the BOM's 72.2 x 52.7 mm MAR2406 board.
         Its 8-bit interface is incompatible with the SPI display wiring;
         the exact hinge and module mounting still require a physical test. -->
    <g
       id="lcd_flap"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1">
      <rect
         x="3"
         y="-64"
         width="78"
         height="64"
         id="rect17"
         style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
      <!-- Hinge mounting keep-clear zones, 25mm each, straddling the shared edge (dashed = reference only, not a cut) -->
      <rect
         x="10"
         y="-4"
         width="25"
         height="8"
         stroke="#06c"
         stroke-dasharray="1,1"
         id="rect18"
         style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
      <rect
         x="52"
         y="-4"
         width="25"
         height="8"
         stroke="#06c"
         stroke-dasharray="1,1"
         id="rect19"
         style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    </g>
    <!-- No angle-stop cut here by design - add a glued offcut/rubber foot after assembly, once you can see the real angle. -->
  </g>
</svg>
