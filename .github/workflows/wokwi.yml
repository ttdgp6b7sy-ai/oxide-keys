name: Wokwi Simulation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add thumbv6m-none-eabi

      - name: Install flip-link
        run: cargo install flip-link

      - name: Build firmware
        run: cargo build --release
        working-directory: firmware

      - name: Install wokwi-cli
        run: |
          wget -q -O /usr/local/bin/wokwi-cli https://github.com/wokwi/wokwi-cli/releases/latest/download/wokwi-cli-linuxstatic-x64
          chmod +x /usr/local/bin/wokwi-cli

      - name: Run Wokwi demo scenario
        working-directory: firmware
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: |
          mkdir -p frames
          wokwi-cli . \
            --scenario wokwi-demo.yaml \
            --timeout 6000 \
            --timeout-exit-code 0

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg 

      - name: Build animated GIF from frames
        working-directory: firmware
        run: |
          ffmpeg -y -framerate 1 -i frames/frame%02d.png \
            -vf "scale=320:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse" \
            -loop 0 wokwi-demo.gif

      - name: Commit demo GIF to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Wokwi demo GIF [skip ci]"
          file_pattern: firmware/wokwi-demo.gif
