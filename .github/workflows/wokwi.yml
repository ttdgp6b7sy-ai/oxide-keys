name: Wokwi Simulation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add thumbv6m-none-eabi

      - name: Install flip-link
        run: cargo install flip-link

      - name: Build firmware
        run: cargo build --release
        working-directory: firmware

      - name: Install wokwi-cli
        run: |
          wget -q -O /usr/local/bin/wokwi-cli https://github.com/wokwi/wokwi-cli/releases/latest/download/wokwi-cli-linuxstatic-x64
          chmod +x /usr/local/bin/wokwi-cli

      - name: Run Wokwi simulation
        working-directory: firmware
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: wokwi-cli . --timeout 5000 --timeout-exit-code 0
