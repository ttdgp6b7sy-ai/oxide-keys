  <!-- Oxide Keys enclosure - FINAL, submission-ready cut file -->
  <!-- All confirmed dimensions pulled directly from pcbfirstdesign.kicad_pcb. -->
  <!-- Kerf compensation: +0.15mm applied to every hole/cutout below, assuming ~0.15mm laser kerf. -->
  <!-- Adjust the kerf allowance if your specific laser/material combo differs (test-cut recommended). -->
  <!-- Solid black = confirmed cut geometry. Dashed = assembly reference marks, not cut lines. -->
  <g
     id="base_plate"
     transform="translate(5,5)"
     fill="none"
     stroke="#000"
     stroke-width="0.1"
     style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1">
    <text
       x="0"
       y="-2"
       font-size="3"
       fill="#000"
       stroke="none"
       id="text1"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1">BASE PLATE</text>
    <rect
       x="0"
       y="0"
       width="97.75"
       height="91.5"
       id="rect1"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- Mounting holes MH1-4, 2.1mm real hole, +0.15mm kerf -> 2.25mm dia -->
    <circle
       cx="2.75"
       cy="2.75"
       r="1.125"
       id="circle1"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <circle
       cx="92.75"
       cy="3.0"
       r="1.125"
       id="circle2"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <circle
       cx="2.5"
       cy="89.0"
       r="1.125"
       id="circle3"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <circle
       cx="92.75"
       cy="88.75"
       r="1.125"
       id="circle4"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
  </g>
  <g
     id="top_panel"
     transform="translate(115,60)"
     fill="none"
     stroke="#000"
     stroke-width="0.1"
     style="fill:none;fill-opacity:1;stroke:#ffffff;stroke-opacity:1">
    <text
       x="0"
       y="-2"
       font-size="3"
       fill="#000"
       stroke="none"
       id="text4"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1">TOP PANEL (switch deck)</text>
    <rect
       x="0"
       y="0"
       width="97.75"
       height="91.5"
       id="rect4"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- Mounting holes, aligned with base plate -->
    <circle
       cx="2.75"
       cy="2.75"
       r="1.125"
       id="circle5"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <circle
       cx="92.75"
       cy="3.0"
       r="1.125"
       id="circle6"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <circle
       cx="2.5"
       cy="89.0"
       r="1.125"
       id="circle7"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <circle
       cx="92.75"
       cy="88.75"
       r="1.125"
       id="circle8"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- 8x Cherry MX switch cutouts, 14.1mm nominal + 0.15mm kerf = 14.25mm square, centered on real SW1-8 anchors -->
    <rect
       x="6.875"
       y="4.045"
       width="14.25"
       height="14.25"
       id="rect8"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- SW1 -->
    <rect
       x="6.875"
       y="23.335"
       width="14.25"
       height="14.25"
       id="rect9"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- SW2 -->
    <rect
       x="26.165"
       y="4.045"
       width="14.25"
       height="14.25"
       id="rect10"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- SW3 -->
    <rect
       x="26.155"
       y="23.335"
       width="14.25"
       height="14.25"
       id="rect11"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- SW4 -->
    <rect
       x="45.455"
       y="4.045"
       width="14.25"
       height="14.25"
       id="rect12"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- SW5 -->
    <rect
       x="45.445"
       y="23.335"
       width="14.25"
       height="14.25"
       id="rect13"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- SW6 -->
    <rect
       x="64.745"
       y="4.045"
       width="14.25"
       height="14.25"
       id="rect14"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- SW7 -->
    <rect
       x="64.725"
       y="23.335"
       width="14.25"
       height="14.25"
       id="rect15"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- SW8 -->
    <!-- Encoder shaft hole: 7mm nominal + 0.15mm kerf = 7.15mm dia. CONFIRM against your EC11's actual bushing spec before cutting. -->
    <circle
       cx="91.25"
       cy="9.5"
       r="3.575"
       stroke="#c00"
       id="circle15"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- Buzzer vent: matches confirmed BZ1 footprint (12mm dia buzzer body) - vent sized for sound, not full body clearance. 10mm + kerf = 10.15mm -->
    <circle
       cx="86.15"
       cy="35.25"
       r="5.075"
       stroke="#600"
       id="circle16"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- USB notch, sized to a generic Micro USB plug - VERIFY against your actual cable before cutting -->
    <rect
       x="71.425"
       y="82.425"
       width="10.15"
       height="6.15"
       stroke="#c00"
       id="rect16"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    <!-- LCD flap, hinged along this panel's top edge (y=0). Sized 72x55mm from the confirmed common-clone -->
    <!-- module dimensions (~72.2x52.7mm PCB) + margin. CONFIRM with calipers once the module arrives. -->
    <g
       id="lcd_flap"
       style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1">
      <rect
         x="5"
         y="-55"
         width="72"
         height="55"
         id="rect17"
         style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
      <!-- Hinge mounting keep-clear zones, 25mm each, straddling the shared edge (dashed = reference only, not a cut) -->
      <rect
         x="10"
         y="-4"
         width="25"
         height="8"
         stroke="#06c"
         stroke-dasharray="1,1"
         id="rect18"
         style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
      <rect
         x="52"
         y="-4"
         width="25"
         height="8"
         stroke="#06c"
         stroke-dasharray="1,1"
         id="rect19"
         style="fill:none;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
    </g>
    <!-- No angle-stop cut here by design - add a glued offcut/rubber foot after assembly, once you can see the real angle. -->
  </g>
