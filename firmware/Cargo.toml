[package]
name = "oxide-keys"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m-rt = "0.7"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
embedded-hal = "1.0.0"
panic-halt = "1.0.0"
rp2040-hal = { version = "0.12.0", features = ["rt"] }
rp2040-boot2 = "0.3"
lcd-ili9341-spi = "0.1.3"
rotary-encoder-hal = "0.6.0"
ws2812-pio = "0.9.0"
embedded-graphics = "0.8.2"
display-interface = "0.5.0"
ili9341 = "0.6.0"
display-interface-spi = "0.5.0"
embedded-hal-bus = "0.3.0"
